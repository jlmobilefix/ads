function iconKey(s){s=s.toLowerCase();if(/chrome/.test(s))return'chrome';if(/google play|play store/.test(s))return'playstore';if(/gmail|email/.test(s))return'gmail';if(/youtube|iptv|ott navigator/.test(s))return'youtube';if(/google maps|maps/.test(s))return'maps';if(/google drive/.test(s))return'drive';if(/google photos/.test(s))return'photos';if(/google search|google app/.test(s))return'google';if(/galaxy store|samsungapps/.test(s))return'galaxystore';if(/samsung internet|browser|internet/.test(s))return'samsunginternet';if(/phone|dialer|call|smart switch|clone/.test(s))return'phone';if(/message|sms|hush/.test(s))return'message';if(/camera|qr/.test(s))return s.includes('qr')?'qr':'camera';if(/setting|systemui/.test(s))return'settings';if(/activity manager|package disabler|knox|mdm|shield|security|dpc/.test(s))return'shield';if(/file|backup|explorer|myfiles|my files|lbf/.test(s))return'folder';if(/play/.test(s))return'playstore';if(/cloud/.test(s))return'cloud';if(/music|audio|voice recorder/.test(s))return'audio';if(/store|galaxy/.test(s))return'store';if(/download|\.apk|xml|zip/.test(s))return'download';if(/calculator/.test(s))return'calculator';if(/shortcut|launcher|navigation|bar settings/.test(s))return'link';if(/info|version|device/.test(s))return'info';return'generic'}

function originalIconKey(s){s=s.toLowerCase();if(/qr camera|qr scan/.test(s))return'qr';if(/dialer code/.test(s))return'dialercode';if(/google play/.test(s))return'playstore';if(/email|gmail/.test(s))return'gmail';if(/galaxy store/.test(s))return'galaxystore';if(/alliance shield/.test(s))return'alliance';if(/activity manager/.test(s))return'activity';if(/xshare/.test(s))return'xshare';if(/file shorts/.test(s))return'fileshorts';if(/smart switch/.test(s))return'smartswitch';if(/package disabler/.test(s))return'package';if(/setting|systemui/.test(s))return'settings';if(/pin code/.test(s))return'pincode';if(/myfiles|my files/.test(s))return'myfiles';if(/hwmoduletest/.test(s))return'hwtest';if(/quick shortcut maker/.test(s))return'shortcut';if(/knox/.test(s))return'knox';if(/google search/.test(s))return'google';if(/calculator/.test(s))return'calculator';if(/usb setting/.test(s))return'usb';if(/splashtop/.test(s))return'splashtop';return null}

function tone(i){return ['g-blue','g-green','g-purple','g-orange','g-red','g-teal','g-slate','g-pink'][i%8]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function category(x){const n=(x.name+' '+x.original+' '+x.url).toLowerCase();if(/\.apk(?:$|[?#])/.test(n)||/\.apk\b/.test(x.name.toLowerCase())||/download|\.apk/.test(x.group.toLowerCase()))return'APK';return'Open App'}
const grid=document.getElementById('grid'),search=document.getElementById('search');let active='All';
function render(){const q=search.value.toLowerCase().trim();const visible=ITEMS.filter(x=>{const cat=category(x);const filterOK=active==='All'||cat===active;return filterOK&&(x.name+' '+x.group+' '+x.original).toLowerCase().includes(q)});grid.innerHTML='';visible.forEach((x,i)=>{const a=document.createElement('a');a.className='app';a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';const key=iconKey(x.name+' '+x.group);const sourceKey=originalIconKey(x.name+' '+x.group+' '+x.original);const originalSrc=sourceKey?originalIcons[sourceKey]:null;const logo=originalSrc||brandLogos[key];const graphic=logo?`<img class="brand-logo" src="${logo}" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">`:'';a.innerHTML=`<span class="tile ${tone(i)} ${logo?'brand-tile':''}">${graphic}<svg class="fallback-icon" viewBox="0 0 24 24" aria-hidden="true" style="${logo?'display:none':''}">${iconPaths[key]||iconPaths[iconKey(x.name+' '+x.group)]||iconPaths.generic}</svg></span><b>${esc(x.name.replace(/\\.apk$/i,''))}</b><small>${esc(category(x))}</small>`;grid.appendChild(a)});document.getElementById('count').textContent=`${visible.length} ${visible.length===1?'item':'items'}`;document.getElementById('sectionTitle').textContent=active==='All'?'All apps':active;document.getElementById('empty').style.display=visible.length?'none':'block'}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));search.addEventListener('input',render);render();
